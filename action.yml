name: 'NPM Trusted Publish Action'
description: 'Publish npm packages using OIDC trusted publishing with release-type aware channel selection'
author: 'Volker Scheuber'

branding:
  icon: 'package'
  color: 'green'

inputs:
  release-type:
    description: 'prerelease | patch | minor | major'
    required: false
    default: 'prerelease'
  package-name:
    description: 'Package name (optional). Used for already-published detection when version is also provided.'
    required: false
    default: ''
  version:
    description: 'Version being published (optional). Used with package-name for already-published detection.'
    required: false
    default: ''
  package-path:
    description: 'Path to package directory containing package.json'
    required: false
    default: '.'
  access:
    description: 'npm publish access level (public|restricted)'
    required: false
    default: 'public'
  tag-override:
    description: 'Override npm publish tag (e.g. next, latest)'
    required: false
    default: ''
  dry-run:
    description: 'When true, print intended commands without publishing'
    required: false
    default: 'false'

outputs:
  published:
    description: 'Whether publish was executed'
    value: ${{ steps.publish.outputs.published }}
  already_published:
    description: 'Whether the requested package@version was already present on npm and publish was skipped'
    value: ${{ steps.publish.outputs.already_published }}
  tag:
    description: 'Resolved npm publish tag'
    value: ${{ steps.publish.outputs.tag }}
  is-prerelease:
    description: 'Whether release-type resolved to prerelease'
    value: ${{ steps.publish.outputs.is_prerelease }}

runs:
  using: 'composite'
  steps:
    - id: publish
      shell: bash
      env:
        RELEASE_TYPE: ${{ inputs.release-type }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        VERSION: ${{ inputs.version }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        ACCESS: ${{ inputs.access }}
        TAG_OVERRIDE: ${{ inputs.tag-override }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        bash "${{ github.action_path }}/scripts/publish.sh"
